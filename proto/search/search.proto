syntax = "proto3";

package search.v1;

option go_package =
    "github.com/chandangowdacbkrewops/krewops-backend/gen/go/search/v1;searchv1";

// SearchService is the single entry point for the mobile app's "Search"
// domain. It fronts two independently queryable capabilities - work
// postings and worker profiles - backed today by direct PostgreSQL queries
// against the shared database owned by work-service and user-service. The
// backend can later move to Elasticsearch/OpenSearch without changing this
// contract.
service SearchService {

  rpc SearchWork(SearchWorkRequest)
      returns (SearchWorkResponse);

  rpc SearchWorkers(SearchWorkersRequest)
      returns (SearchWorkersResponse);
}

message SearchWorkRequest {
  optional string keyword = 1;
  optional string work_type_id = 2;
  optional string city = 3;
  optional string state = 4;
  optional string experience_level = 5;
  optional string payment_type = 6;
  optional double min_budget_rate = 7;
  optional double max_budget_rate = 8;

  optional int32 page = 9;
  optional int32 page_size = 10;
}

message WorkSummary {
  string id = 1;
  string user_id = 2;
  string status = 3;

  optional string title = 4;
  optional string work_type_id = 5;
  optional string work_type_name = 6;
  optional string description = 7;

  optional string address = 8;
  optional string city = 9;
  optional string state = 10;
  optional double latitude = 11;
  optional double longitude = 12;

  optional int32 workers_needed = 13;
  optional string experience_level = 14;
  repeated string skills = 15;

  optional string start_date = 16;
  optional int32 duration_value = 17;
  optional string duration_unit = 18;
  optional string shift_timing = 19;

  optional string payment_type = 20;
  optional double budget_rate = 21;

  optional string published_at = 22;
  string created_at = 23;
}

message SearchWorkResponse {
  repeated WorkSummary results = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message SearchWorkersRequest {
  optional string keyword = 1;
  optional string work_type_id = 2;
  optional string city = 3;
  optional string state = 4;
  optional string worker_type = 5;
  optional string availability_status = 6;
  optional double min_experience_years = 7;

  optional int32 page = 8;
  optional int32 page_size = 9;
}

message WorkerSkillSummary {
  string work_type_id = 1;
  string work_type_name = 2;
  optional double experience_years = 3;
}

message WorkerSummary {
  string id = 1;
  string user_id = 2;

  optional string first_name = 3;
  optional string last_name = 4;
  optional string city = 5;
  optional string state = 6;

  string worker_type = 7;
  optional string crew_name = 8;
  int32 crew_size = 9;

  optional double experience_years = 10;
  optional double expected_rate = 11;
  optional string rate_type = 12;

  string availability_status = 13;
  string verification_status = 14;

  optional string bio = 15;

  repeated WorkerSkillSummary skills = 16;
}

message SearchWorkersResponse {
  repeated WorkerSummary results = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
