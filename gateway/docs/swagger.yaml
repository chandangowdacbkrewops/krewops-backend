info:
  contact: {}
  description: |-
    Public REST API exposed by the KrewOps API Gateway. The gateway fronts the auth,
    user, work, and search gRPC services, exposing them as a single JSON/REST surface
    for mobile and web clients. All responses are wrapped in a consistent envelope
    (see response.SuccessResponse / response.ErrorResponse).
  title: KrewOps API Gateway
  version: "1.0"
paths:
  /auth/otp/request:
    post:
      consumes:
      - application/json
      description: Sends a one-time password via SMS to the given phone number. Used
        to start login/signup.
      parameters:
      - description: Phone number to send the OTP to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RequestOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.RequestOTPResponseData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.ErrorResponse'
        "429":
          description: Too many OTP requests for this phone number
          schema:
            $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.ErrorResponse'
      summary: Request an OTP
      tags:
      - Auth
  /auth/otp/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verifies the OTP sent to the given phone number. On success returns an access/refresh token pair
        and the authenticated user's profile completion state. Creates the user on first verification.
      parameters:
      - description: Phone number and OTP code to verify
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.VerifyOTPResponseData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.ErrorResponse'
        "401":
          description: OTP is invalid or expired
          schema:
            $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_chandangowdacbkrewops_krewops-backend_gateway_internal_response.ErrorResponse'
      summary: Verify an OTP and log in
      tags:
      - Auth
  /search/work:
    get:
      parameters:
      - description: Free-text keyword search
        in: query
        name: keyword
        type: string
      - description: Filter by work type ID
        in: query
